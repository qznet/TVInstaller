plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bigsinger.tvinstaller'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bigsinger.tvinstaller'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // Produces an installable local release APK. Use a production keystore
            // before distributing through an app store.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                outputFileName = "TVInstallerFromSamba-release-${defaultConfig.versionName}.apk"
            }
        }
    }
}

dependencies {
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.8'
    implementation 'org.slf4j:slf4j-nop:1.7.32'
}
