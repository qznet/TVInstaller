name: Build TVInstallerFromSamba APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TVInstallerFromSamba/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-samba:
    name: Build TVInstallerFromSamba release APK
    runs-on: ubuntu-latest
    # Use the Android SDK preinstalled on the GitHub runner image so ANDROID_HOME and
    # ANDROID_SDK_ROOT point to the same location (avoids the "conflicting SDK path" error).
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install required Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build release APK (Gradle 8.7)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: TVInstallerFromSamba
          arguments: assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVInstallerFromSamba-release-apk
          path: TVInstallerFromSamba/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
