name: Build TVInstallerFromSamba APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TVInstallerFromSamba/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-samba:
    name: Build TVInstallerFromSamba release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (manual)
        run: |
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build release APK (Gradle 8.7)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          build-root-directory: TVInstallerFromSamba
          arguments: assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVInstallerFromSamba-release-apk
          path: TVInstallerFromSamba/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
