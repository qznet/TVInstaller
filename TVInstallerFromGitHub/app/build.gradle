plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvig.installer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvig.installer'
        minSdk 17
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', "${rootDir}/../data"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // A local release artifact must be installable even when no production
            // keystore has been supplied. Replace this with the production key for publishing.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                outputFileName = "TVInstallerFromGitHub-release-${defaultConfig.versionName}.apk"
            }
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    testImplementation 'junit:junit:4.13.2'
}
